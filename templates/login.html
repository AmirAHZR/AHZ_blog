{% extends 'base.html' %}

{% block content %}

<h1>Login</h1>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <button type="submit">Login</button>

</form>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<p>
    Don't have an account?
    <a href="{{ url_for('signup') }}">Sign Up</a>
</p>

{% endblock %}
```
