{% extends 'base.html' %}

{% block content %}

<h1>Sign Up</h1>
 {% if errors %}
    <div class="errors">
        {% for error in errors %}
            <p>{{ error }}</p>
        {% endfor %}
    </div>
    {% endif %}
<form method="POST">
   
    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <button type="submit">Sign Up</button>

</form>



<p>
    Already have an account?
    <a href="{{ url_for('login') }}">Login</a>
</p>

{% endblock %}
```
