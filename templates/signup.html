{% extends 'base.html' %}

{% block content %}

<h1>Sign Up</h1>

<form method="POST">

    <input
        type="text"
        name="username"
        placeholder="Username"
        required
    >

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <button type="submit">Sign Up</button>

</form>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<p>
    Already have an account?
    <a href="{{ url_for('login') }}">Login</a>
</p>

{% endblock %}
```
